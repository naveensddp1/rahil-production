apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: patient-deployment
    name: patient-deployment
  annotations: argocd.argoproj.io/sync-options: confirm
spec:
  replicas: 5
  selector:
    matchLabels:
      app: patient-deployment
  strategy: 
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 1 
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: patient-deployment
    spec:
      containers:
      - image: nginx:1.27
        name: nginx
        ports:
        - containerPort: 80
        resources: 
          requests:
              cpu: 100m 
              memory: 64Mi
          limits:
              cpu: 250m
              memory: 128Mi
