apiVersion: v1
kind: Service
metadata:
  name: patient-svc
  namespace: rahil-ns
  labels:
    app: patient-svc
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  ports:
  - name: 80-80
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: patient-deployment
  type: NodePort
