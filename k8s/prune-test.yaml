apiVersion: apps/v1
kind: Deployment
metadata:
  name: prune-test
  namespace: rahil-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prune-test
  template:
    metadata:
      labels:
        app: prune-test
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
