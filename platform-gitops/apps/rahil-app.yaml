apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/naveensddp1/rahil-production.git
    path: k8s
    targetRevision: main
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: rahil-ns
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
